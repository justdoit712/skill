name: Deploy to GitHub Pages

# 由顶层入口 sync-skills.yml 通过 workflow_call 显式调用，不自行监听 push——
# 避免出现两个独立部署入口发布不同版本（§7.2）。
#
# 契约（§7.2 步骤 6）：
#   只发布同一次运行中已生成的 public/ 产物，该产物由 sync job 上传。
#   不重新稀疏检出仓库里的旧 public/，也不在缺少数据与生成器的环境中构建。
#
# 不在本文件声明 concurrency：顶层运行已持有固定组，重复申请会相互阻塞（§7.2）。

on:
  workflow_call:
    inputs:
      artifact_name:
        description: '承载 public/ 的产物名'
        type: string
        default: pages-public

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 下载同一次运行生成的页面产物
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: public

      - name: 确认产物非空
        run: |
          set -euo pipefail
          test -d public || { echo "::error::未取到 public 产物"; exit 1; }
          count=$(find public -type f | wc -l)
          [ "$count" -gt 0 ] || { echo "::error::public 产物为空"; exit 1; }
          echo "产物文件数：$count"

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: 部署并记录结果
        id: deployment
        uses: actions/deploy-pages@v4

      - name: 部署摘要
        run: |
          echo "## 部署结果" >> "$GITHUB_STEP_SUMMARY"
          echo "- 页面地址：${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- 对应数据提交：${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
