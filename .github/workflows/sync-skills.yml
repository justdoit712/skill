name: Sync Skills

# 顶层入口。依据需求 §7.2，单次运行承载七步，并**分成两个阶段执行**：
#   阶段一（reserve）：1 检出与预检 → 2 发现与预筛 → 3 预留额度 → 提交并推送
#   阶段二（evaluate）：4 评估和生成 → 5 验证与提交 → 6 发布同一产物 → 7 部署验证
#
# 阶段一与阶段二之间必须有一次成功的提交推送：额度账本只有在推送之后才对下一次
# 运行可见。若途中中断或 push 失败，流程在阶段二之前停止，不会产生付费调用，
# 也就不会出现"消耗了额度但账本没记上"的重复计费。
#
# 不靠机器人提交触发第二次 push：GITHUB_TOKEN 触发的 push 不会启动新 workflow。
# 手动与定时共享同一额度账本（§7.3）。
#
# 【定时触发当前停用】2026-09-23：首次发布尚未完成（线上实测 404），且 deploy job 的
# 条件引用了不存在的 step id（审计报告 P0-3），跑通也不会发布，只会白耗额度与 GitHub 配额。
# 因此暂时只保留手动触发；发布现有内容请用 publish-pages.yml（只上传已提交产物，不采集不评估）。
# 恢复定时：取消下面 schedule 的注释，并同步更新 tests/test_workflows.py 的相应断言。

on:
  # schedule:
  #   - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只验证配置与计算计划：不调用模型、不写账本、不提交、不部署'
        type: boolean
        default: false
      limit_queries:
        description: '限制搜索查询数，留空为全部（本地抽样用）'
        required: false
        default: ''
      limit_evaluations:
        description: '本批最多评估数'
        required: false
        default: '50'
      limit_fetches:
        description: '本轮最多抓取多少条上游内容，留空则跟随本批评估名额'
        required: false
        default: ''
      expand_limit:
        description: '本轮最多展开多少个仓库到具体技能，留空为不限'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: skills-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      dry_run: ${{ steps.run.outputs.dry_run }}
      week: ${{ steps.run.outputs.week }}
    steps:
      - name: 检出（完整，含 config、data、public）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 组装参数
        id: args
        env:
          LIMIT_QUERIES: ${{ github.event.inputs.limit_queries }}
          LIMIT_EVALUATIONS: ${{ github.event.inputs.limit_evaluations || '50' }}
          LIMIT_FETCHES: ${{ github.event.inputs.limit_fetches }}
          EXPAND_LIMIT: ${{ github.event.inputs.expand_limit }}
        run: |
          set -euo pipefail
          args="--config-dir config --data-dir data --public-dir public"
          if [ -n "${LIMIT_QUERIES}" ]; then args="$args --limit-queries ${LIMIT_QUERIES}"; fi
          if [ -n "${LIMIT_EVALUATIONS}" ]; then args="$args --limit-evaluations ${LIMIT_EVALUATIONS}"; fi
          if [ -n "${LIMIT_FETCHES}" ]; then args="$args --limit-fetches ${LIMIT_FETCHES}"; fi
          if [ -n "${EXPAND_LIMIT}" ]; then args="$args --expand-limit ${EXPAND_LIMIT}"; fi
          echo "args=$args" >> "$GITHUB_OUTPUT"
          echo "week=$(python -c 'from src.shared.runtime import week_id; print(week_id())')" >> "$GITHUB_OUTPUT"

      - name: 干跑（不调用模型、不写账本）
        if: github.event.inputs.dry_run == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python -m src.pipeline --dry-run ${{ steps.args.outputs.args }}

      - name: 阶段一 · 发现、预筛与预留额度
        id: reserve
        if: github.event.inputs.dry_run != 'true'
        env:
          # 带上 token 才能把搜索限额从 10/分钟提到 30/分钟、core 从 60/小时提到 5000/小时，
          # 否则"展开到具体技能"每小时只能处理约 30 个仓库
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python -m src.pipeline --phase reserve --json ${{ steps.args.outputs.args }} | tee reserve.json
          echo "dry_run=false" >> "$GITHUB_OUTPUT"

      - name: 提交并推送额度预留（必须先于任何付费调用）
        if: github.event.inputs.dry_run != 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for p in data/state data/queue.json; do
            if [ -e "$p" ]; then git add -- "$p"; fi
          done
          if git diff --cached --quiet; then
            echo "额度无变化，无需推送"
          else
            git commit -m "chore(state): 预留额度 ${{ steps.args.outputs.week }}"
            git pull --rebase --autostash
            git push || { echo "::error::额度预留推送失败，已停止，不进行付费调用"; exit 1; }
          fi

      - name: 阶段二 · 评估、索引与周报
        if: github.event.inputs.dry_run != 'true'
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${LLM_API_KEY}" || { echo "::error::缺少 LLM_API_KEY（应来自 Secrets）"; exit 1; }
          python -m src.pipeline --phase evaluate --json ${{ steps.args.outputs.args }} | tee evaluate.json

      - name: 验证索引与页面数据同源
        if: github.event.inputs.dry_run != 'true'
        run: |
          set -euo pipefail
          for f in data/catalog.json public/data/catalog.json; do
            test -s "$f" || { echo "::error::$f 缺失或为空"; exit 1; }
          done
          python - <<'PY'
          import json
          index = json.load(open('data/catalog.json', encoding='utf-8'))
          page = json.load(open('public/data/catalog.json', encoding='utf-8'))
          assert page['generated_at'] == index['generated_at'], '页面数据与索引不同源'
          ids = {e['skill_id'] for e in index['entries']}
          exposed = {e['skill_id'] for e in page['recommended'] + page['candidates']}
          assert exposed <= ids, '页面数据出现索引中不存在的条目'
          print('同源校验通过：条目', len(ids), '页面展示', len(exposed))
          PY

      - name: 提交结果（显式范围，禁止 git add .）
        if: github.event.inputs.dry_run != 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for p in data/catalog.json data/queue.json data/reports data/state public/data public/reports; do
            if [ -e "$p" ]; then git add -- "$p"; fi
          done
          if git diff --cached --quiet; then
            echo "无变更需要提交"
          else
            git commit -m "chore(sync): 每周采集与评估 ${{ steps.args.outputs.week }}"
            git pull --rebase --autostash
            git push
          fi

      - name: 上传页面产物（供部署 job 使用同一产物）
        if: github.event.inputs.dry_run != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pages-public
          path: public
          retention-days: 7

  deploy:
    needs: sync
    if: needs.sync.outputs.dry_run == 'false'
    uses: ./.github/workflows/deploy-pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
