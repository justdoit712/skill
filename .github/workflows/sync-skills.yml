name: Sync Skills

# 顶层入口。依据需求 §7.2，单次运行承载七步，并**分成两个阶段执行**：
#   阶段一（reserve）：1 检出与预检 → 2 发现与预筛 → 3 预留额度 → 提交并推送
#   阶段二（evaluate）：4 评估和生成 → 5 验证与提交 → 6 发布同一产物 → 7 部署验证
#
# 阶段一与阶段二之间必须有一次成功的提交推送：额度账本只有在推送之后才对下一次
# 运行可见。若途中中断或 push 失败，流程在阶段二之前停止，不会产生付费调用，
# 也就不会出现"消耗了额度但账本没记上"的重复计费。
#
# 不靠机器人提交触发第二次 push：GITHUB_TOKEN 触发的 push 不会启动新 workflow。
# 定时为每周日北京时间 10:00（UTC 0 2 * * 0）。手动与定时共享同一额度账本（§7.3）。
#
# 【开关在配置文件里】是否真正执行由 config/automation.json 的 scheduled_sync_enabled 决定
# （true=执行，false=跳过）。on.schedule 属静态配置，文件无法在运行期注册或注销触发器，
# 因此 schedule 始终保留在本文件，由 gate job 读配置后在运行期决定是否继续：
#   false → 该次运行只做一次检出与判断（约 10 秒）即退出，不采集、不调用模型、不写账本、不部署。
# 手动触发（Run workflow）不受该开关限制，始终执行。

on:
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只验证配置与计算计划：不调用模型、不写账本、不提交、不部署'
        type: boolean
        default: false
      limit_queries:
        description: '限制搜索查询数，留空为全部（本地抽样用）'
        required: false
        default: ''
      limit_evaluations:
        description: '本批最多评估数'
        required: false
        default: '50'
      limit_fetches:
        description: '本轮最多抓取多少条上游内容，留空则跟随本批评估名额'
        required: false
        default: ''
      expand_limit:
        description: '本轮最多展开多少个仓库到具体技能，留空为不限'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: skills-sync
  cancel-in-progress: false

jobs:
  gate:
    # 读取 config/automation.json 的 scheduled_sync_enabled，决定本轮是否继续。
    # 缺失文件或字段按 false 处理（无人值守的定时任务不会因为文件丢失而开始花钱）；
    # 文件存在但内容损坏时直接报错，让失败可见，而不是静默停用。
    runs-on: ubuntu-latest
    outputs:
      run_sync: ${{ steps.decide.outputs.run_sync }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      - name: 检出（只需读 config/automation.json）
        uses: actions/checkout@v4

      - name: 判定本轮是否执行
        id: decide
        run: |
          set -euo pipefail
          enabled=$(python3 - <<'PY'
          import json
          import pathlib
          path = pathlib.Path("config/automation.json")
          if not path.exists():
              print("false")
          else:
              data = json.loads(path.read_text(encoding="utf-8"))
              value = data.get("scheduled_sync_enabled") if isinstance(data, dict) else None
              print("true" if value is True else "false")
          PY
          )
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run_sync=true" >> "$GITHUB_OUTPUT"
            echo "reason=手动触发，不受 automation.json 开关限制" >> "$GITHUB_OUTPUT"
          elif [ "$enabled" = "true" ]; then
            echo "run_sync=true" >> "$GITHUB_OUTPUT"
            echo "reason=定时触发且 scheduled_sync_enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_sync=false" >> "$GITHUB_OUTPUT"
            echo "reason=config/automation.json 的 scheduled_sync_enabled 非 true，本轮跳过（不采集、不调用模型、不写账本、不部署）" >> "$GITHUB_OUTPUT"
          fi

      - name: 记录判定结果
        run: |
          set -euo pipefail
          echo "### 自动化开关判定" >> "$GITHUB_STEP_SUMMARY"
          echo "- 触发方式：${{ github.event_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- 本轮执行：${{ steps.decide.outputs.run_sync }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- 原因：${{ steps.decide.outputs.reason }}" >> "$GITHUB_STEP_SUMMARY"

  sync:
    needs: gate
    if: needs.gate.outputs.run_sync == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      # 引用必须指向真实存在的 step id：reserve 步骤写 dry_run，args 步骤写 week。
      # （历史上这里写成不存在的 steps.run，导致 deploy 条件恒假、定时跑通也不发布。）
      dry_run: ${{ steps.reserve.outputs.dry_run }}
      week: ${{ steps.args.outputs.week }}
    steps:
      - name: 检出（完整，含 config、data、public）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 组装参数
        id: args
        env:
          LIMIT_QUERIES: ${{ github.event.inputs.limit_queries }}
          LIMIT_EVALUATIONS: ${{ github.event.inputs.limit_evaluations || '50' }}
          LIMIT_FETCHES: ${{ github.event.inputs.limit_fetches }}
          EXPAND_LIMIT: ${{ github.event.inputs.expand_limit }}
        run: |
          set -euo pipefail
          args="--config-dir config --data-dir data --public-dir public"
          if [ -n "${LIMIT_QUERIES}" ]; then args="$args --limit-queries ${LIMIT_QUERIES}"; fi
          if [ -n "${LIMIT_EVALUATIONS}" ]; then args="$args --limit-evaluations ${LIMIT_EVALUATIONS}"; fi
          if [ -n "${LIMIT_FETCHES}" ]; then args="$args --limit-fetches ${LIMIT_FETCHES}"; fi
          if [ -n "${EXPAND_LIMIT}" ]; then args="$args --expand-limit ${EXPAND_LIMIT}"; fi
          echo "args=$args" >> "$GITHUB_OUTPUT"
          echo "week=$(python -c 'from src.shared.runtime import week_id; print(week_id())')" >> "$GITHUB_OUTPUT"

      - name: 干跑（不调用模型、不写账本）
        if: github.event.inputs.dry_run == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python -m src.pipeline --dry-run ${{ steps.args.outputs.args }}

      - name: 阶段一 · 发现、预筛与预留额度
        id: reserve
        if: github.event.inputs.dry_run != 'true'
        env:
          # 带上 token 才能把搜索限额从 10/分钟提到 30/分钟、core 从 60/小时提到 5000/小时，
          # 否则"展开到具体技能"每小时只能处理约 30 个仓库
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python -m src.pipeline --phase reserve --json ${{ steps.args.outputs.args }} | tee reserve.json
          echo "dry_run=false" >> "$GITHUB_OUTPUT"

      - name: 提交并推送额度预留（必须先于任何付费调用）
        if: github.event.inputs.dry_run != 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for p in data/state data/queue.json; do
            if [ -e "$p" ]; then git add -- "$p"; fi
          done
          if git diff --cached --quiet; then
            echo "额度无变化，无需推送"
          else
            git commit -m "chore(state): 预留额度 ${{ steps.args.outputs.week }}"
            git pull --rebase --autostash
            git push || { echo "::error::额度预留推送失败，已停止，不进行付费调用"; exit 1; }
          fi

      - name: 阶段二 · 评估、索引与周报
        if: github.event.inputs.dry_run != 'true'
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${LLM_API_KEY}" || { echo "::error::缺少 LLM_API_KEY（应来自 Secrets）"; exit 1; }
          python -m src.pipeline --phase evaluate --json ${{ steps.args.outputs.args }} | tee evaluate.json

      - name: 验证索引与页面数据同源
        if: github.event.inputs.dry_run != 'true'
        run: |
          set -euo pipefail
          for f in data/catalog.json public/data/catalog.json; do
            test -s "$f" || { echo "::error::$f 缺失或为空"; exit 1; }
          done
          python - <<'PY'
          import json
          index = json.load(open('data/catalog.json', encoding='utf-8'))
          page = json.load(open('public/data/catalog.json', encoding='utf-8'))
          assert page['generated_at'] == index['generated_at'], '页面数据与索引不同源'
          ids = {e['skill_id'] for e in index['entries']}
          exposed = {e['skill_id'] for e in page['recommended'] + page['candidates']}
          assert exposed <= ids, '页面数据出现索引中不存在的条目'
          print('同源校验通过：条目', len(ids), '页面展示', len(exposed))
          PY

      - name: 提交结果（显式范围，禁止 git add .）
        if: github.event.inputs.dry_run != 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for p in data/catalog.json data/queue.json data/reports data/state public/data public/reports; do
            if [ -e "$p" ]; then git add -- "$p"; fi
          done
          if git diff --cached --quiet; then
            echo "无变更需要提交"
          else
            git commit -m "chore(sync): 每周采集与评估 ${{ steps.args.outputs.week }}"
            git pull --rebase --autostash
            git push
          fi

      - name: 上传页面产物（供部署 job 使用同一产物）
        if: github.event.inputs.dry_run != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pages-public
          path: public
          retention-days: 7

  deploy:
    needs: sync
    # sync 已被 gate 按 automation.json 放行或跳过；这里只再排除 dry_run。
    # dry_run 时 reserve 步骤被跳过，其输出为空，条件自然为假，不会部署。
    if: needs.sync.outputs.dry_run == 'false'
    uses: ./.github/workflows/deploy-pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
