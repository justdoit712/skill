name: Sync Skills

# 顶层入口。依据需求 §7.2，单次运行承载以下步骤（同一 workflow 内显式依赖，
# 不靠机器人提交触发第二次 push）：
#   1 检出与预检 → 2 发现与预筛 → 3 预留额度 → 4 评估和生成
#   → 5 验证与提交 → 6 发布同一产物 → 7 部署验证
#
# 采集与评估流程尚未实现，见 docs/Skills导航目录实施文档.md 阶段 C。
# 因此当前仅支持手动触发，且运行时会明确失败——不产生"成功但什么都没做"的假象。
#
# 定时触发在阶段 C 启用，依据 §7.1 为每周日北京时间 10:00：
#   schedule:
#     - cron: '0 2 * * 0'

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: skills-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 检出
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 采集、评估与生成（尚未实现）
        run: |
          echo "::error::新流程尚未实现。见 docs/Skills导航目录实施文档.md 阶段 B、C。"
          exit 1
